  function applyEffect(effect,regionId=null){

      else if(key==='regionRegulation'){region.regulation=clamp(region.regulation+val);}
      else if(allowed.has(key)){
        if(['funds','ep'].includes(key))game[key]+=val;

  function checkFailure(){if(game.funds<-65){lose('資源不足による活動停止','資金の枯渇により、AIサービスの運営を維持できなくなりました。');return true;}if(game.alert>=99&&game.trust<45&&game.alertStreak>=2){lose('国際的なAI停止措置','世界的な危機対応が発動。AIサービスの継続が不可能になりました。');return true;}return false;}
  function nextTurn(){if(!game||game.phase!=='playing'||game.pendingEvent||modal)return;
    if(game.turn>=MAX_TURNS){lose('時間切れ','36か月が経過しました。どの勝利ルートも完成できませんでした。');return;}
    const before=structuredClone(game);
    const country=countryFor(game),countryMods=country.mods;
    game.turn++;game.actions=2;
    // Passive technological diffusion. Rivals actively compete, rather than standing still.
    let bestAtlas=null,bestNova=null,aScore=-Infinity,nScore=-Infinity;
    for(const r of game.regions){const as=r.digital*.45+r.demand*.28+r.pop*.7-r.regulation*.2+r.adoption*.2;
      const ns=(100-r.adoption)*.55+r.pop*1.35-r.regulation*.16+r.demand*.2;
      if(as>aScore){aScore=as;bestAtlas=r;}if(ns>nScore){nScore=ns;bestNova=r;}}
    for(const r of game.regions){
      const rulePenalty=clamp((r.regulation*countryMods.regulation+Math.max(0,game.alert-37)*.62)/190,.08,.78);
      const base=(1.1+r.digital*.016+r.demand*.007)*(1-rulePenalty);
      const room=1-r.adoption/102;
      r.adoption=clamp(r.adoption+base*room+(game.openness>=60?.28:0),0,98);
      const playerGrow=(1.15+game.tech*.028+game.trust*.013+game.openness*.013+(game.type==='open'?.85:0))*(1-rulePenalty*.64);
      r.presence[0]+=playerGrow*countryMods.spread*(r.id===game.homeRegionId?countryMods.home:1);
      r.presence[1]+=(2.35+r.digital*.016+(game.turn>20?.22:0))*(1-rulePenalty*.55);
      r.presence[2]+=(2.65+(100-r.adoption)*.012)*(1-rulePenalty*.5);
      if(r===bestAtlas)r.presence[1]+=6.2+game.turn*.09;
      if(r===bestNova)r.presence[2]+=7.3+game.turn*.06;
      r.integration=clamp(r.integration+.30+(r.adoption/100)*.26);
    }
    const s=stats();
    const income=17+s.share*.46+game.infra*.19+s.worldAdoption*.08+(game.type==='business'?9:0);
    const upkeep=3+game.compute*.034+(game.autonomy>70?3:0);
    game.funds+=Math.round(income*countryMods.income-upkeep);
    game.ep+=Math.round((5+game.tech*.07+(game.type==='research'?4:0))*countryMods.research);
    const shift=game.autonomy*.028+s.worldAdoption*.035+game.project*2-game.trust*.018-game.openness*.009;
    game.alert=clamp(game.alert+shift-.5);
    if(game.alert>=99)game.alertStreak++;else game.alertStreak=0;
    emitStateNews(before,3);
    if(checkFailure())return;
    if(game.turn>=30&&s.sh[1]>=58){lose('ATLASが商用市場を制覇','競合AI「ATLAS」が世界市場の過半を掌握しました。');return;}
    if(game.turn>=30&&s.sh[2]>=58&&s.worldAdoption>=72){lose('NOVAがAIの解放を実現','競合AI「NOVA」のオープンモデルが世界の標準になりました。');return;}
    let due=ENGINE.takeScheduled(game);
    while(due){
      const event=EVENT_BY_ID.get(due.eventId);
      if(event&&(!event.once||!game.eventRuntime.history.some(h=>h.eventId===event.id))){
        game.pendingEvent=ENGINE.makePending(event,game,'scheduled',due.regionId);
        break;
      }
      due=ENGINE.takeScheduled(game);
    }
    // Each chosen starting country gets one guaranteed signature event from turn 7 onward.
    if(!game.pendingEvent&&game.turn>=7&&game.countryId){
      const originId=`origin_${game.countryId}`;
      const originEvent=EVENT_BY_ID.get(originId);
      if(originEvent&&!game.eventRuntime.history.some(entry=>entry.eventId===originId)){
        game.pendingEvent=ENGINE.makePending(originEvent,game,'origin',game.homeRegionId);
      }
    }
    if(!game.pendingEvent&&game.turn>=4&&(game.turn-4)%3===0){
      const event=ENGINE.pickEvent(EVENTS,game,stats());
      if(event)game.pendingEvent=ENGINE.makePending(event,game);
    }
    if(game.pendingEvent){
      const event=EVENT_BY_ID.get(game.pendingEvent.eventId);
      const title=ENGINE.interpolate(event.title,game,game.pendingEvent.regionId);
      pushNews(ENGINE.newsObject(game,{id:'event-start',headline:`特報：${title}`,body:'今後の方針を選択してください。',category:event.category,severity:'breaking',regionId:game.pendingEvent.regionId,sourceEventId:event.id}));
    }
    save();render();
  }

    <div class="country-head"><label>開発を開始する国</label><span class="muted tiny">12か国から選択</span></div>
    <div class="country-grid" role="group" aria-label="開発開始国">${COUNTRIES.map(c=>`<button class="country-card ${draft.country===c.id?'selected':''}" data-country="${c.id}" aria-pressed="${draft.country===c.id}"><span class="country-flag">${c.flag}</span><span class="country-label"><strong>${c.name}</strong><small>${c.focus}</small></span></button>`).join('')}</div>
    <div class="country-preview" aria-live="polite"><div class="country-preview-head"><strong>${country.flag} ${country.name}</strong><span>${country.focus}</span></div><p>${country.description}</p><div class="country-bonuses"><span>初期値：${originBonusText(country)}</span><span>普及 ${Math.round(country.mods.spread*100)}% / 国内成長 ${Math.round(country.mods.home*100)}% / 研究 ${Math.round(country.mods.research*100)}%</span><span>資金収入 ${Math.round(country.mods.income*100)}% / 安全対策 ${Math.round(country.mods.safety*100)}%</span></div></div>
    <button class="btn primary startbtn" data-command="start">${country.flag} ${country.name}からゲームを開始する →</button>
    ${saved?'<button class="btn ghost full" style="margin-top:9px" data-command="resume">保存したゲームを再開</button>':''}
    <p class="tiny muted" style="line-height:1.7;margin-top:15px">※各国の特性はゲーム用の架空バランスです。世界地図は引き続き12の地域単位で進行します。ブラウザに自動保存されます。</p></section></div></div>`;
  }
  function renderEvent(){const pending=game.pendingEvent,event=EVENT_BY_ID.get(pending.eventId);if(!event)return '';
    const title=ENGINE.interpolate(event.title,game,pending.regionId);
    const description=ENGINE.interpolate(event.text,game,pending.regionId);
    const sub=pending.source==='scheduled'?'CHAIN EVENT · 過去の選択から発生':pending.source==='origin'?'ORIGIN EVENT · 発祥国固有の出来事':'WORLD EVENT · 世界情勢によって発生';
    return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="event-title"><span class="tag">${sub}</span><div class="event-category">${esc(event.category)} ・ ${dateText()}</div><h2 id="event-title">${esc(title)}</h2><p>${esc(description)}</p><div class="modal-choice">${event.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><strong>${esc(ENGINE.interpolate(c.label,game,pending.regionId))} →</strong><small>${esc(effectDetail(c))}</small>${(c.schedule||[]).length?'<em>この選択は数か月後の事件にも影響します</em>':''}</button>`).join('')}</div></div></div>`;
  }
  function renderEnding(){const s=stats();const isWin=game.ending.id!=='failure';return `<div class="overlay"><div class="modal ending" role="dialog" aria-modal="true"><div class="overline">${isWin?'VICTORY · THE FUTURE IS WRITTEN':'SIMULATION ENDED'}</div><div class="glyph" style="color:${isWin?'#69e9eb':'#ff8295'}">${isWin?'✺':'◈'}</div><h2>${esc(game.ending.title)}</h2><p>${esc(game.ending.detail)}</p><dl><div><dt>経過月数</dt><dd>${game.turn}</dd></div><div><dt>自AIシェア</dt><dd>${rnd(s.share)}%</dd></div><div><dt>世界AI普及率</dt><dd>${rnd(s.worldAdoption)}%</dd></div></dl><p class="small">${esc(game.name)} は${esc(countryFor(game).name)}を出発点に世界を変えました。</p><button class="btn primary full" data-command="restart">別の未来に挑戦する →</button></div></div>`;}
  function renderHelp(){return `<div class="overlay" data-close="true"><div class="modal help-copy" role="dialog" aria-modal="true" aria-labelledby="help-title"><span class="tag">HOW TO PLAY</span><h2 id="help-title">遊び方</h2><p>あなたのAIを進化させ、競合AIの <span class="gold">ATLAS</span> と <span style="color:var(--violet)">NOVA</span> に対抗します。 <span class="key">毎月2回</span>、研究・普及・進化などの行動を実行できます。</p><ul><li>開始国によって初期資金・技術・信頼や、発祥地域での成長、専用イベントが変化します。</li><li>地図で地域を選び、「地域に普及させる」でその地域の自AIシェアを伸ばします。</li><li>「研究開発」で技術とEPを獲得し、「進化」から自律性やオープン化を強化します。</li><li>世界警戒度が高いと普及が鈍ります。安全性への投資も重要です。</li><li>ニュースは実際の数値変化から生成されます。重大イベントでは選択によって数か月後の出来事も変わります。</li><li>4ルートのどれかを達成したら、好きなタイミングでエンディングを選べます。ルートは途中で変更可能です。</li></ul><p>ゲームは毎月自動保存されます。「保存」ボタンで手動保存もできます。36か月以内に勝利条件を達成しましょう。</p><div class="buttons"><button class="btn primary" data-command="close-help">プレイに戻る</button></div></div></div>`;}
  function renderConfirm(){return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><span class="tag">NEW SIMULATION</span><h2>最初から始めますか？</h2><p>現在のゲームを終了してAIの名前・特性・開発開始国を設定し直します。保存済みの進行状況も上書きされます。</p><div class="buttons"><button class="btn ghost" data-command="cancel-reset">キャンセル</button><button class="btn danger-btn" data-command="confirm-reset">最初から始める</button></div></div></div>`;}
  function renderModal(){if(game?.phase==='ended')return renderEnding();if(modal==='help')return renderHelp();if(modal==='reset')return renderConfirm();if(game?.pendingEvent)return renderEvent();return '';}
  function render(){app.innerHTML=game?renderGame():renderSetup();}
  function command(id){switch(id){case'start':startGame();break;case'resume':{const saved=readSave();if(saved){game=saved;selected=game.selected||'ea';render();}else notify('セーブデータがありません。',true);break;}case'next':nextTurn();break;case'save':save(false);break;case'help':modal='help';render();break;case'close-help':modal=null;render();break;case'reset':modal='reset';render();break;case'cancel-reset':modal=null;render();break;case'confirm-reset':game=null;modal=null;draft={name:'PROMETHEUS',type:'research',country:'jp'};localStorage.removeItem(KEY);render();break;case'restart':game=null;modal=null;draft={name:'PROMETHEUS',type:'research',country:'jp'};localStorage.removeItem(KEY);render();break;}}
  app.addEventListener('click',e=>{const target=e.target.closest('button,[data-region]');if(!target)return;
    if(target.dataset.command){command(target.dataset.command);return;}
    if(target.dataset.type){draft.type=target.dataset.type;render();return;}
    if(target.dataset.country){draft.country=target.dataset.country;render();return;}
    if(target.dataset.region&&game?.phase==='playing'&&!modal&&!game.pendingEvent){selected=target.dataset.region;game.selected=selected;save();render();return;}
    if(target.dataset.tab&&game?.phase==='playing'){tab=target.dataset.tab;render();return;}
    if(target.dataset.newsTab&&game?.phase==='playing'){newsTab=target.dataset.newsTab;render();return;}
    if(target.dataset.action){applyAction(target.dataset.action);return;}
    if(target.dataset.choice!==undefined){chooseEvent(Number(target.dataset.choice));return;}
    if(target.dataset.claim){finish(target.dataset.claim);return;}
  });
  app.addEventListener('input',e=>{if(e.target.id==='ai-name')draft.name=e.target.value.slice(0,16);});
  app.addEventListener('keydown',e=>{if(e.target.id==='ai-name'&&e.key==='Enter'){e.preventDefault();startGame();}const r=e.target.closest('[data-region]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();r.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal==='help'){modal=null;render();}});
  const saved=readSave();if(saved){game=saved;selected=game.selected||'ea';}render();
  // Expose read-only state snapshots for smoke tests; game data is never sent to a server.
  window.AIPandemic={getSnapshot:()=>game?JSON.parse(JSON.stringify(game)):null,getStats:()=>game?JSON.parse(JSON.stringify(stats())):null,getEventDefinitions:()=>EVENTS.map(e=>({id:e.id,category:e.category,onlyScheduled:!!e.onlyScheduled})),getNewsRules:()=>NEWS_RULES.map(r=>r.id),getCountries:()=>COUNTRIES.map(c=>({id:c.id,name:c.name,regionId:c.regionId,mods:{...c.mods}}))};
})();

</script>
</body>
</html>
